<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ed">
    <meta name="description" content="記錄台大校園的照度與位置。">
    <title>NTU Light Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>台大亮度地圖 <small>NTU LUX MAP</small></span></div>
        <span class="project-tag">ESP32 × VEML7700</span>
      </header>

      <div class="intro">
        <h1>帶著他，去追一隻螢火蟲<span class="period">.</span></h1>
        <p>紀錄台大校園的亮度</p>
      </div>

      <section class="hero" aria-label="目前亮度">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="hero-top"><span class="hero-label">即時照度 <span class="live-dot" aria-hidden="true"></span></span><span id="bleStatus" class="hero-status">尚未連線</span></div>
        <div class="lux-line"><strong id="luxValue">—</strong><span>lux</span></div>
        <p class="hero-note">目前測得的照度。</p>
        <button id="connectButton" type="button" class="button button-bright"><span id="connectLabel">連接 ESP32_LUX</span><span aria-hidden="true">↗</span></button>
      </section>

      <div class="section-heading"><span>開始測量</span><span>01 — 02</span></div>

      <section class="panel" aria-label="定位">
        <div class="panel-icon" aria-hidden="true">◎</div>
        <div class="panel-main">
          <div class="panel-head"><h2>手機定位</h2><span id="locationStatus" class="status-pill">尚未取得</span></div>
          <p id="coordinates" class="detail">為紀錄加上位置。</p>
          <button id="locationButton" type="button" class="button button-outline">啟用定位 <span aria-hidden="true">↗</span></button>
        </div>
      </section>

      <section class="panel record-panel" aria-label="紀錄設定">
        <div class="panel-icon" aria-hidden="true">≋</div>
        <div class="panel-main">
          <div class="panel-head"><h2>資料紀錄</h2><span id="recordStatus" class="status-pill">未開始</span></div>
          <label for="intervalSelect">紀錄間隔</label>
          <div class="select-wrap"><select id="intervalSelect">
            <option value="1">每 1 秒</option>
            <option value="5" selected>每 5 秒</option>
            <option value="10">每 10 秒</option>
            <option value="30">每 30 秒</option>
          </select></div>
          <div class="actions">
            <button id="startButton" type="button" class="button button-dark" disabled>● &nbsp;開始記錄</button>
            <button id="stopButton" type="button" class="button button-outline" disabled>停止</button>
          </div>
          <div class="archive">
            <div><span class="archive-label">已儲存在這支手機</span><strong><span id="rowCount">0</span> <small>筆紀錄</small></strong></div>
            <button id="exportButton" type="button" class="button button-export" disabled>匯出全部 CSV <span aria-hidden="true">↓</span></button>
          </div>
          <div class="recent-records" aria-labelledby="recentHeading">
            <div class="recent-head"><h3 id="recentHeading">最近紀錄</h3><span>台北時間 · 最多 10 筆</span></div>
            <ol id="recentRows" class="recent-list"><li class="recent-empty">尚無紀錄</li></ol>
          </div>
        </div>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <footer>資料留在這支手機的瀏覽器。記錄時請保持頁面開啟；手機鎖屏可能中斷接收。</footer>
    </main>
  </body>
</html>
