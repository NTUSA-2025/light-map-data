<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070a0d">
    <meta name="description" content="採集台大校園的照度與位置，供台大夜間亮度地圖使用。">
    <title>照度資料採集｜台大夜間亮度地圖</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="coverage-map.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand"><img class="brand-mark" src="logo.png" alt=""><div><span class="brand-kicker">NTU NIGHT LIGHT MAP / FIELD DATA</span><h1>照度資料採集</h1></div></div>
        <span class="project-tag">ESP32 <span aria-hidden="true">/</span> VEML7700</span>
      </header>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div class="dashboard">
        <section class="hero" aria-labelledby="luxHeading">
          <div class="hero-top"><h2 id="luxHeading"><span class="card-number">01</span> 現場照度 <span class="live-dot" aria-hidden="true"></span></h2><span id="bleStatus" class="hero-status">尚未連線</span></div>
          <div class="lux-line"><strong id="luxValue">—</strong><span>lux</span></div>
          <button id="connectButton" type="button" class="button button-bright"><span id="connectLabel">連接 ESP32_LUX</span><span aria-hidden="true">↗</span></button>
        </section>

        <section class="panel location-panel" aria-labelledby="locationHeading">
          <div class="panel-head"><h2 id="locationHeading"><button id="mapToggle" class="map-toggle" type="button" aria-expanded="false" aria-controls="mapPanel"><span class="card-number">02</span> 採集位置 <span class="map-toggle-label">地圖</span><span class="map-chevron" aria-hidden="true">⌄</span></button></h2><span id="locationStatus" class="status-pill">尚未取得</span></div>
          <div class="location-content">
            <p id="coordinates" class="detail">啟用定位，為每筆照度紀錄加上座標。</p>
            <button id="locationButton" type="button" class="button button-outline"><span id="locationLabel">啟用定位</span><span aria-hidden="true">↗</span></button>
          </div>
          <div id="mapPanel" class="map-panel" hidden>
            <div class="map-toolbar"><strong id="coverageCount">已覆蓋 0 / 501 格</strong><button id="recenterButton" type="button" class="button button-outline" disabled>回到目前位置</button></div>
            <div id="coverageMap" class="coverage-map" role="region" aria-label="台大主要道路格覆蓋地圖"></div>
            <div class="map-legend"><span><i class="legend-swatch uncovered" aria-hidden="true"></i>尚未測量</span><span><i class="legend-swatch covered" aria-hidden="true"></i>已覆蓋</span><span><i class="legend-swatch road" aria-hidden="true"></i>主要道路</span><span><i class="legend-swatch current" aria-hidden="true"></i>目前位置</span></div>
            <p id="mapStatus" class="map-status" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="panel record-panel" aria-labelledby="recordHeading">
          <div class="panel-head"><h2 id="recordHeading"><span class="card-number">03</span> 採集紀錄</h2><span id="recordStatus" class="status-pill">未開始</span></div>
          <p id="recordHint" class="record-hint">連接照度計並啟用定位後即可開始。</p>
          <div class="record-controls">
            <div class="interval-field"><label for="intervalSelect">紀錄間隔</label><div class="select-wrap"><select id="intervalSelect">
              <option value="1" selected>每 1 秒</option>
              <option value="5">每 5 秒</option>
              <option value="10">每 10 秒</option>
              <option value="30">每 30 秒</option>
            </select></div></div>
            <div class="actions">
              <button id="startButton" type="button" class="button button-dark" disabled>● &nbsp;開始記錄</button>
              <button id="stopButton" type="button" class="button button-outline" disabled>停止</button>
            </div>
          </div>
          <div class="archive">
            <div><span class="archive-label">本機已儲存</span><strong><span id="rowCount">0</span> <small>筆紀錄</small></strong></div>
            <button id="exportButton" type="button" class="button button-export" disabled>匯出全部 CSV <span aria-hidden="true">↓</span></button>
          </div>
        </section>
      </div>

      <section class="panel recent-records" aria-labelledby="recentHeading">
        <div class="recent-head"><div><span class="section-kicker">LOCAL DATA</span><h2 id="recentHeading">最近採集紀錄</h2></div><div class="recent-tools"><span>台北時間 · 最多 10 筆</span><button id="clearButton" type="button" class="button button-danger" disabled>刪除全部紀錄</button></div></div>
        <ol id="recentRows" class="recent-list"><li class="recent-empty">尚無紀錄</li></ol>
      </section>

      <footer>本頁採集的資料供台大夜間亮度地圖使用，不會自動上傳。請匯出 CSV 供後續整理；記錄時保持頁面開啟，手機鎖屏可能中斷接收。</footer>
    </main>
  </body>
</html>
